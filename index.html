<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gig Ticket Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #ffffff; text-align: center; margin: 0; padding: 15px; }
    h2 { margin-top: 5px; margin-bottom: 15px; font-size: 20px; }
    .panel { max-width: 360px; margin: 0 auto; }
    input { width: 100%; box-sizing: border-box; padding: 14px; font-size: 16px; border: none; border-radius: 8px; background: #ffffff; color: #000000; }
    #scanner-screen { display: none; }
    #reader { width: 100%; max-width: 360px; margin: 0 auto; border-radius: 12px; overflow: hidden; background: #000; }
    #camera-error { display: none; margin: 15px auto; color: #ffab91; }
    #pin-error { min-height: 20px; margin-top: 12px; color: #ff8a80; }
    #result-box { margin: 20px auto; padding: 20px; border-radius: 12px; max-width: 360px; display: none; }
    .checking { background: #333; border: 3px solid #777; }
    .valid { background: #1b5e20; border: 3px solid #4caf50; }
    .duplicate { background: #b71c1c; border: 3px solid #ff5252; }
    .invalid { background: #e65100; border: 3px solid #ff9800; }
    .status-title { font-size: 22px; font-weight: bold; margin-bottom: 10px; }
    .attendee-name { font-size: 18px; margin-bottom: 5px; }
    .meta-info { font-size: 14px; opacity: 0.9; margin-bottom: 10px; }
    .qty-badge { background: #ffeb3b; color: #000; padding: 5px 15px; border-radius: 20px; font-size: 18px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
    button { margin-top: 15px; padding: 14px 28px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; background: #ffffff; color: #000000; cursor: pointer; width: 100%; }
    button.secondary { background: #ffd54f; margin-bottom: 10px; }
  </style>
</head>
<body>

  <h2>🎟️ Gig Door Scanner</h2>

  <div id="pin-screen" class="panel">
    <input id="pin-input" type="password" placeholder="Door PIN" autocomplete="off">
    <button id="pin-btn" onclick="submitPin()">Unlock scanner</button>
    <div id="pin-error"></div>
  </div>

  <div id="scanner-screen">
    <div id="reader"></div>
    <div id="camera-error">
      <div id="camera-error-text"></div>
      <button onclick="startScanner()">Retry camera</button>
    </div>

    <div id="result-box">
      <div id="status-title" class="status-title"></div>
      <div id="qty-badge" class="qty-badge" style="display:none;"></div>
      <div id="attendee-name" class="attendee-name"></div>
      <div id="meta-info" class="meta-info"></div>
      <button id="retry-btn" class="secondary" style="display:none" onclick="retryLast()">Retry check</button>
      <button onclick="resumeScanner()">Scan next ticket</button>
    </div>
  </div>

  <script>
    // ==========================================================
    // ⚠️ CRITICAL: PASTE YOUR GOOGLE SCRIPT WEB APP URL BELOW
    // ==========================================================
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzuIavxiGj3HFGkedQRBER-rIL2ySAKFHw5kf22ZCulRaeZp-T54pC3_M2tMQDADeth/exec";

    let html5QrCode = null;
    let scannerStarted = false;
    let isProcessing = false;
    let currentPin = '';
    let lastCode = '';
    const el = id => document.getElementById(id);

    function tryPin(pin) {
      if (!pin) { el('pin-error').innerText = 'Enter the PIN.'; return; }
      el('pin-btn').disabled = true;
      el('pin-error').innerText = '';

      fetch(`${WEB_APP_URL}?action=checkpin&pin=${encodeURIComponent(pin)}`)
        .then(r => r.json())
        .then(r => {
          el('pin-btn').disabled = false;
          if (r.ok) {
            currentPin = pin;
            el('pin-screen').style.display = 'none';
            el('scanner-screen').style.display = 'block';
            startScanner();
          } else {
            el('pin-error').innerText = 'Wrong PIN or connection issue.';
          }
        }).catch(err => {
          el('pin-btn').disabled = false;
          el('pin-error').innerText = 'Connection problem: ' + err.message;
        });
    }

    function submitPin() { tryPin(el('pin-input').value.trim()); }

    function startScanner() {
      el('camera-error').style.display = 'none';
      if (!html5QrCode) html5QrCode = new Html5Qrcode('reader');
      html5QrCode.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: (w, h) => ({ width: Math.floor(Math.min(w, h) * 0.7), height: Math.floor(Math.min(w, h) * 0.7) }) },
        (decodedText) => {
          if (isProcessing) return;
          isProcessing = true;
          try { html5QrCode.pause(); } catch(e){}
          verify(decodedText);
        },
        () => {}
      ).catch(err => {
        el('camera-error-text').innerText = 'Camera error. Allow camera access and tap Retry.';
        el('camera-error').style.display = 'block';
      });
    }

    function resumeScanner() {
      el('result-box').style.display = 'none';
      el('qty-badge').style.display = 'none';
      isProcessing = false;
      try { html5QrCode.resume(); } catch(e){}
    }

    function retryLast() { if (lastCode) verify(lastCode); }

    function verify(code) {
      lastCode = code;
      const box = el('result-box');
      box.className = 'checking';
      box.style.display = 'block';
      el('retry-btn').style.display = 'none';
      el('qty-badge').style.display = 'none';
      
      el('status-title').innerText = 'Checking database...';
      el('attendee-name').innerText = code;
      el('meta-info').innerText = '';

      fetch(`${WEB_APP_URL}?action=verify&code=${encodeURIComponent(code)}&pin=${encodeURIComponent(currentPin)}`)
        .then(r => r.json())
        .then(res => {
          if (res.status === 'VALID') {
            box.className = 'valid';
            el('status-title').innerText = '✅ VALID TICKET';
            el('qty-badge').innerText = 'HAND OVER ' + res.jumlah + ' TICKET(S)';
            el('qty-badge').style.display = 'inline-block';
            el('attendee-name').innerText = res.name;
            el('meta-info').innerText = 'Code: ' + res.code;
          } else if (res.status === 'DUPLICATE') {
            box.className = 'duplicate';
            el('status-title').innerText = '❌ ALREADY SCANNED!';
            el('qty-badge').innerText = res.jumlah + ' TICKETS ALREADY CLAIMED';
            el('qty-badge').style.display = 'inline-block';
            el('attendee-name').innerText = res.name;
            el('meta-info').innerText = 'Checked in at ' + res.time;
          } else {
            box.className = 'invalid';
            el('status-title').innerText = '⚠️ INVALID TICKET';
            el('attendee-name').innerText = 'Code not found';
            el('meta-info').innerText = 'Scanned: ' + res.code;
          }
        }).catch(err => {
          box.className = 'duplicate';
          el('status-title').innerText = '⚠️ CONNECTION ERROR';
          el('attendee-name').innerText = 'Check internet and tap Retry check';
          el('meta-info').innerText = err.message;
          el('retry-btn').style.display = 'block';
        });
    }
  </script>
</body>
</html>
