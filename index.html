<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIGS: Scanner Console</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  
  <!-- Import sleek modern font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #09090b;
      --bg-panel: rgba(24, 24, 27, 0.85);
      --accent-blue: #38bdf8;
      --accent-blue-dark: #0284c7;
      --accent-green: #34d399;
      --accent-green-dark: #059669;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body { background-color: var(--bg-main); color: var(--text-main); font-family: 'Outfit', sans-serif; margin: 0; padding: 20px; text-align: center; }
    
    h2 { font-weight: 800; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 25px; background: linear-gradient(to right, var(--accent-blue), #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* Customizing the ugly default scanner UI */
    #reader { width: 100%; max-width: 450px; margin: 0 auto; border: none !important; border-radius: 20px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,0.1), 0 20px 50px rgba(0,0,0,0.6); background: #121214; }
    #reader video { border-radius: 20px; }
    #reader__dashboard_section_csr span { color: var(--text-main) !important; font-family: 'Outfit', sans-serif !important; }
    #reader button { background: linear-gradient(135deg, var(--accent-blue), var(--accent-blue-dark)); color: #fff; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; font-family: 'Outfit', sans-serif; margin: 10px 5px; transition: 0.2s; }
    #reader select { background: #1f2937; color: #fff; border: 1px solid #334155; padding: 10px; border-radius: 10px; font-family: 'Outfit', sans-serif; margin-bottom: 10px; }
    
    #status { margin-top: 25px; font-weight: 600; color: var(--text-muted); font-size: 14px; letter-spacing: 1px; }

    /* Glassmorphism Modals */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 999; }
    
    @keyframes slideUp {
      from { transform: translateY(30px) scale(0.95); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .modal-content, .modal-success { animation: slideUp 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; margin: 15% auto; width: 85%; max-width: 360px; padding: 35px 25px; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7); }
    
    .modal-content { background: var(--bg-panel); border: 1px solid rgba(255,255,255,0.1); }
    .modal-success { background: rgba(6, 39, 22, 0.85); border: 1px solid rgba(52, 211, 153, 0.3); box-shadow: 0 0 40px rgba(52, 211, 153, 0.15); }
    
    /* Typography inside Modals */
    .tag { display: inline-block; padding: 6px 12px; background: rgba(56, 189, 248, 0.15); color: var(--accent-blue); border-radius: 20px; font-size: 11px; font-weight: 800; letter-spacing: 1.5px; margin-bottom: 15px; }
    .tag-success { background: rgba(52, 211, 153, 0.15); color: var(--accent-green); }
    
    #m-name { font-size: 26px; font-weight: 800; margin: 0 0 20px 0; line-height: 1.2; }
    .big-number { font-size: 72px; color: var(--accent-green); font-weight: 800; margin: 0; line-height: 1; text-shadow: 0 0 20px rgba(52,211,153,0.3); }
    
    /* Stats Dashboard */
    .stats { background: rgba(0,0,0,0.4); padding: 20px; border-radius: 16px; margin: 0 0 20px 0; border: 1px solid rgba(255,255,255,0.05); }
    .stats p { margin: 0 0 8px 0; font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }
    .fraction { font-size: 32px; font-weight: 800; color: var(--accent-blue); }
    
    /* Stepper UI */
    .stepper { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 25px 0; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.03); }
    .stepper button { width: 45px; height: 45px; font-size: 24px; border: none; border-radius: 14px; background: rgba(255,255,255,0.08); color: white; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; font-family: 'Outfit'; }
    .stepper button:active { background: var(--accent-blue); color: #000; transform: scale(0.9); }
    .stepper input { width: 60px; text-align: center; font-size: 36px; font-weight: 800; background: transparent; color: white; border: none; outline: none; pointer-events: none; padding: 0; margin: 0; }
    
    /* Premium Buttons */
    .btn { padding: 18px; border: none; border-radius: 14px; font-weight: 800; cursor: pointer; width: 100%; font-size: 13px; letter-spacing: 2px; margin-top: 12px; transition: all 0.2s; font-family: 'Outfit', sans-serif; text-transform: uppercase; }
    .btn-blue { background: linear-gradient(135deg, var(--accent-blue), var(--accent-blue-dark)); color: #fff; box-shadow: 0 8px 20px rgba(2, 132, 199, 0.3); }
    .btn-green { background: linear-gradient(135deg, var(--accent-green), var(--accent-green-dark)); color: #fff; box-shadow: 0 8px 20px rgba(5, 150, 105, 0.3); }
    .btn-blue:active, .btn-green:active { transform: scale(0.96); box-shadow: none; }
    .btn-dark { background: transparent; color: var(--text-muted); border: 1px solid rgba(255,255,255,0.1); }
    .btn-dark:active { background: rgba(255,255,255,0.05); }
  </style>
</head>
<body>
  <h2>Scanner Console</h2>
  <div id="reader"></div>
  <p id="status">System Ready. Waiting for scan...</p>

  <!-- PARTIAL CHECK-IN PREVIEW MODAL -->
  <div id="checkinModal" class="modal">
    <div class="modal-content">
      <div class="tag">✅ TICKET FOUND</div>
      <p id="m-name">Name</p>
      
      <div class="stats">
        <p>Available on this QR</p>
        <div class="fraction" id="m-fraction">0 / 0</div>
      </div>

      <p style="color:var(--text-muted); font-size:11px; text-transform: uppercase; font-weight: 600; letter-spacing: 1px; margin: 20px 0 10px 0;">How many entering now?</p>
      <div class="stepper">
        <button onclick="changeAmt(-1)">−</button>
        <input type="number" id="m-amt" value="1" readonly>
        <button onclick="changeAmt(1)">+</button>
      </div>

      <button class="btn btn-blue" onclick="confirmCheckin()">Confirm Check-in</button>
      <button class="btn btn-dark" onclick="closeModal()">Cancel</button>
    </div>
  </div>

  <!-- SUCCESS HANDOUT MODAL -->
  <div id="successModal" class="modal">
    <div class="modal-success">
      <div class="tag tag-success">✅ APPROVED</div>
      <p style="color:var(--text-muted); font-size:12px; text-transform:uppercase; letter-spacing:1px; margin-top:15px; font-weight: 600;">Please hand out exactly:</p>
      
      <div class="big-number" id="s-handout">0</div>
      <p style="color:#fff; font-size:14px; font-weight:800; text-transform:uppercase; letter-spacing:2px; margin: 5px 0 25px 0;">Physical Tickets</p>
      
      <div class="stats" style="margin-bottom: 25px; border-color: rgba(52, 211, 153, 0.2);">
        <p>Updated QR Balance</p>
        <div class="fraction" style="color: var(--accent-green);" id="s-balance">0 / 0 Left</div>
      </div>
      
      <button class="btn btn-green" onclick="closeSuccess()">Scan Next Ticket</button>
    </div>
  </div>

  <script>
    // ==========================================
    // REPLACE THIS WITH YOUR NEW DEPLOYMENT URL
    // ==========================================
    const scriptUrl = "https://script.google.com/macros/s/AKfycbzuIavxiGj3HFGkedQRBER-rIL2ySAKFHw5kf22ZCulRaeZp-T54pC3_M2tMQDADeth/exec"; 
    
    let currentPin = localStorage.getItem('scanner_pin');
    if (!currentPin) {
      currentPin = prompt("Enter Scanner PIN:");
      localStorage.setItem('scanner_pin', currentPin);
    }

    let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 250 } });
    let currentTicket = null;
    let maxAvailable = 0;
    let selectedAmt = 1;

    function setStatus(msg, color="var(--text-muted)") {
      const st = document.getElementById('status');
      st.innerText = msg;
      st.style.color = color;
    }

    function onScanSuccess(decodedText) {
      html5QrcodeScanner.pause();
      setStatus("Processing ticket data...", "var(--accent-blue)");
      
      fetch(scriptUrl + "?action=lookup&code=" + encodeURIComponent(decodedText) + "&pin=" + encodeURIComponent(currentPin))
        .then(r => r.json())
        .then(data => {
          if (data.status === "VALID") {
            openModal(data);
          } else if (data.status === "FULLY_USED") {
            alert("❌ ALL TICKETS USED!\\nName: " + data.name + "\\nTotal Purchased: " + data.total);
            html5QrcodeScanner.resume();
            setStatus("System Ready. Waiting for scan...");
          } else {
            alert("❌ INVALID TICKET CODE!");
            html5QrcodeScanner.resume();
            setStatus("System Ready. Waiting for scan...");
          }
        }).catch(e => {
          alert("Network Error. Check your internet connection.");
          html5QrcodeScanner.resume();
          setStatus("System Ready. Waiting for scan...");
        });
    }

    function openModal(data) {
      currentTicket = data;
      maxAvailable = data.remaining;
      selectedAmt = maxAvailable; 
      
      document.getElementById('m-name').innerText = data.name;
      document.getElementById('m-fraction').innerText = data.remaining + " / " + data.total;
      
      updateAmtDisplay();
      document.getElementById('checkinModal').style.display = 'block';
    }

    function closeModal() {
      document.getElementById('checkinModal').style.display = 'none';
      html5QrcodeScanner.resume();
      setStatus("System Ready. Waiting for scan...");
    }

    function changeAmt(delta) {
      selectedAmt += delta;
      if (selectedAmt < 1) selectedAmt = 1;
      if (selectedAmt > maxAvailable) selectedAmt = maxAvailable;
      updateAmtDisplay();
    }

    function updateAmtDisplay() {
      document.getElementById('m-amt').value = selectedAmt;
    }

    function confirmCheckin() {
      document.getElementById('checkinModal').style.display = 'none';
      setStatus("Securely logging check-in...", "var(--accent-green)");
      
      fetch(scriptUrl + "?action=checkin&code=" + encodeURIComponent(currentTicket.code) + "&pin=" + encodeURIComponent(currentPin) + "&amount=" + selectedAmt)
        .then(r => r.json())
        .then(data => {
          if (data.status === "SUCCESS") {
            document.getElementById('s-handout').innerText = data.checkedInNow;
            document.getElementById('s-balance').innerText = data.remaining + " / " + currentTicket.total + " Left";
            document.getElementById('successModal').style.display = 'block';
          } else {
            alert("❌ Error: " + data.status);
            html5QrcodeScanner.resume();
            setStatus("System Ready. Waiting for scan...");
          }
        }).catch(e => {
          alert("Network Error. Please try again.");
          html5QrcodeScanner.resume();
          setStatus("System Ready. Waiting for scan...");
        });
    }

    function closeSuccess() {
      document.getElementById('successModal').style.display = 'none';
      html5QrcodeScanner.resume();
      setStatus("System Ready. Waiting for scan...");
    }

    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
